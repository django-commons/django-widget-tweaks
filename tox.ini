[tox]
envlist =
    py{311,312,313,314}-dj52
    pypy311-dj52
    py{312,313,314}-dj60
    py{312,313,314,315}-dj61
    py314-djmain
    py313-djqa

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315
    pypy-3.11: pypy311

[gh-actions:env]
DJANGO =
    5.2: dj52
    6.0: dj60
    6.1: dj61
    main: djmain
    qa: djqa

[testenv]
deps =
    coverage
    dj52: django>=5.2,<5.3
    dj60: django>=6.0,<6.1
    dj61: django>=6.1,<6.2
    djmain: https://github.com/django/django/archive/main.tar.gz
usedevelop = True
setenv =
    PYTHONDONTWRITEBYTECODE=1
# Django development version is allowed to fail the test matrix
ignore_outcome =
    djmain: True
ignore_errors =
    djmain: True
commands =
    coverage run -m django test -v2 --settings=tests.settings
    coverage report -m

[testenv:py313-djqa]
ignore_errors = true
basepython = python3.13
setenv =
    DJANGO_SETTINGS_MODULE=tests.settings
deps =
    black
    django
    prospector
skip_install = true
commands =
    prospector -X
    black -t py311 --check --diff .
