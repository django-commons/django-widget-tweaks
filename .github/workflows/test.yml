name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: build (Python ${{ matrix.python-version }}, Django ${{ matrix.django-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        django-version: ['5.2', '6.0', '6.1']
        include:
          # PyPy, to back the PyPy classifier
          - python-version: 'pypy-3.11'
            django-version: '5.2'
          # Django 6.1 is the first release to support Python 3.15
          - python-version: '3.15'
            django-version: '6.1'
          # Tox configuration for QA environment
          - python-version: '3.13'
            django-version: 'qa'
          # Django main is allowed to fail, see ignore_outcome in tox.ini
          - python-version: '3.14'
            django-version: 'main'
        exclude:
          - python-version: '3.11'
            django-version: '6.0'
          - python-version: '3.11'
            django-version: '6.1'

    steps:
    # Actions are pinned to a full-length commit SHA
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade tox tox-gh-actions

    - name: Tox tests
      run: |
        tox -v
      env:
        DJANGO: ${{ matrix.django-version }}
