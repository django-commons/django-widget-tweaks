version: 2
updates:
- package-ecosystem: "pip"
  directory: "/"
  schedule:
    interval: "daily"
    time: "12:00"
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
- package-ecosystem: "github-actions"
  directory: "/"
  groups:
    github-actions:
      patterns:
      - "*"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
