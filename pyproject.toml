[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "django-widget-tweaks"
dynamic = ["version", "readme"]
description = "Tweak the form field rendering in templates, not in python-level form definitions."
authors = [
    {name = "Mikhail Korobov", email = "kmike84@gmail.com"},
]
dependencies = [
    "django>=5.2",
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/django-commons/django-widget-tweaks"

[tool.setuptools]
packages = ["widget_tweaks", "widget_tweaks.templatetags"]

[tool.setuptools.dynamic]
# The changelog is shown after the README on PyPI
readme = {file = ["README.rst", "CHANGES.rst"], content-type = "text/x-rst"}

[tool.setuptools_scm]
version_scheme = "post-release"
